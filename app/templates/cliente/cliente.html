<!DOCTYPE html>
  <html lang="es">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Clientes - Colosio</title> 
      <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
      <link rel="stylesheet" href="{{ url_for('static', filename='cliente.css') }}">  
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    </head>
    <body>
 
      <div class="sidebar">
        <a href="/" class="logo-button">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Colosio Logo" class="logo">
        </a>
        <div class="menu-item">
          <img src="{{ url_for('static', filename='img/clientes_icono.png') }}" alt="Cliente Icono" class="icono"> Cliente
        </div>
        <div class="menu-item">
          <img src="{{ url_for('static', filename='img/rentas_icono.png') }}"alt="Rentas Icono" class="icono"> Rentas
        </div>
        <div class="menu-item">
          <img src="{{ url_for('static', filename='img/inventario_icono.png') }}" alt="Inventario Icono" class="icono"> Inventario
        </div>
        <div class="menu-item disabled">
          <img src="{{ url_for('static', filename='img/sistema_pago_icono.png') }}"alt="Sistema Pago Icono" class="icono"> Sistema de Pago
        </div>
        <div class="menu-item">
          <img src="{{ url_for('static', filename='img/informes_icono.png') }}" alt="Informes Icono" class="icono"> Informes
        </div>
        <div style="margin-top: auto; width: 100%;">
          <div class="menu-item">
            <img src="{{ url_for('static', filename='img/ajustes_icono.png') }}" alt="Ajustes Icono" class="icono"> Ajustes
          </div>
          <div class="menu-item">
            <img src="{{ url_for('static', filename='img/usuario_icono.png') }}" alt="Usuario Icono" class="icono"> Usuario
          </div>
        </div>
      </div>

      <div class="main">

        <div class="top-bar">
          <button class="back-button">⬅</button>
          <h2>Clientes</h2>
        </div>

        <div class="watermark">
          <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Colosio Logo" class="watermark">
        </div>

        <div class="client-section">
          <h3>Buscar Cliente Registrado</h3>
          <div class="search-container">
            <input type="text" placeholder="ID inválido o nombre, ingresalo de nuevo">
            <button class="search-btn">🔍</button>
          </div>
          <button class="new-client-btn">➕ Nuevo Cliente</button>

        </div>
      </div>
    </body>
  </html>
