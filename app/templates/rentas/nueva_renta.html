<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nueva Renta</title>
  <link rel="stylesheet" href="/app/static/nueva_renta.css">
</head>
<body>
  <div class="sidebar">
    <a href="#" class="logo-button">
      <img src="/app/static/img/logo.png" alt="Logo" class="logo">
    </a>
    <div class="menu-item">
      <img src="/app/static/img/clientes_icono.png" alt="Cliente Icono" class="icono"> Cliente
    </div>
    <div class="menu-item">
      <img src="/app/static/img/rentas_icono.png" alt="Rentas Icono" class="icono"> Rentas
    </div>
    <div class="menu-item">
      <img src="/app/static/img/inventario_icono.png" alt="Inventario Icono" class="icono"> Inventario
    </div>
    <div class="menu-item disabled">
      <img src="/app/static/img/sistema_pago_icono.png" alt="Sistema Pago Icono" class="icono"> Sistema de Pago
    </div>
    <div class="menu-item">
      <img src="/app/static/img/informes_icono.png" alt="Informes Icono" class="icono"> Informes
    </div>
    <div style="margin-top: auto; width: 100%;">
      <div class="menu-item">
        <img src="/app/static/img/ajustes_icono.png" alt="Ajustes Icono" class="icono"> Ajustes
      </div>
      <div class="menu-item">
        <img src="/app/static/img/usuario_icono.png" alt="Usuario Icono" class="icono"> Usuario
      </div>
    </div>
  </div>

  <div class="main">
    <div class="top-buttons">
      <button class="action-button">
        <img src="/app/static/img/factura_icono.png" alt="Factura"> Generar Factura
      </button>
      <button class="action-button">Finalizar Renta</button>
    </div>

    <div class="renta-layout">
      <!-- Lado Izquierdo -->
      <div class="left-side">
        <div class="section">
          <h3>Buscar Cliente</h3>
          <input type="text" placeholder="Nombre del cliente">
          <button>Buscar</button>
        </div>
        <div class="section">
          <h3>Periodo de Alquiler</h3>
          <label>Fecha inicio:</label>
          <input type="date">
          <label>Fecha fin:</label>
          <input type="date">
        </div>
        <div class="section">
          <h3>Inventario</h3>
          <input type="text" placeholder="Buscar producto...">
          <button>Agregar</button>
        </div>
      </div>

      <!-- Lado Derecho -->
      <div class="right-side">
        <div class="section">
          <h3>Información</h3>
          <textarea rows="5" placeholder="Notas adicionales..."></textarea>
        </div>
        <div class="section">
          <h3>Productos Agregados</h3>
          <ul>
            <li>Producto 1 - Cantidad: 1</li>
            <li>Producto 2 - Cantidad: 2</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
