<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='menu.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='inventario.css') }}">

</head>
<body>

  <div class="sidebar">
    <a href="/" class="logo-button">
      <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Colosio Logo" class="logo">
    </a>
    <div class="menu-item">
      <img src="{{ url_for('static', filename='img/clientes_icono.png') }}" alt="Cliente Icono" class="icono"> Cliente
    </div>
    <div class="menu-item">
      <img src="{{ url_for('static', filename='img/rentas_icono.png') }}"alt="Rentas Icono" class="icono"> Rentas
    </div>
    <div class="menu-item">
      <img src="{{ url_for('static', filename='img/inventario_icono.png') }}" alt="Inventario Icono" class="icono"> Inventario
    </div>
    <div class="menu-item disabled">
      <img src="{{ url_for('static', filename='img/sistema_pago_icono.png') }}"alt="Sistema Pago Icono" class="icono"> Sistema de Pago
    </div>
    <div class="menu-item">
      <img src="{{ url_for('static', filename='img/informes_icono.png') }}" alt="Informes Icono" class="icono"> Informes
    </div>
    <div style="margin-top: auto; width: 100%;">
      <div class="menu-item">
        <img src="{{ url_for('static', filename='img/ajustes_icono.png') }}" alt="Ajustes Icono" class="icono"> Ajustes
      </div>
      <div class="menu-item">
        <img src="{{ url_for('static', filename='img/usuario_icono.png') }}" alt="Usuario Icono" class="icono"> Usuario
      </div>
    </div>
  </div>

  
  <div class="main-content">
    <div class="top-bar">
      <h2>Existencias</h2>
      <div class="actions">
        <div class="search-bar">
          <input type="text" placeholder="Buscar producto...">
          <button class="filter-btn">🔍</button>
        </div>
        <button class="btn-add">➕ Nuevo Producto</button>
        <button class="btn-add">➕ Nueva Colección</button>
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio Unitario</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="product-info">
                <img src="/app/static/img/placeholder_producto.png" alt="Producto">
                <div>
                  <strong>Andamio Estrecho 40 x 60</strong><br>
                  sjdnakckxsanasdvcasd
                </div>
              </div>
            </td>
            <td>10</td>
            <td>$999999999</td>
            <td>Disponible</td>
          </tr>
          <tr>
            <td>
              <div class="product-info">
                <img src="/app/static/img/placeholder_producto.png" alt="Producto">
                <div>
                  <strong>Andamio Estrecho 40 x 60</strong><br>
                  sjdnakckxsanasdvcasd
                </div>
              </div>
            </td>
            <td>1</td>
            <td>$999999999</td>
            <td>Dañado</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
